name: Verify
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.1
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, Web identity, health, Markdown and draft tests, production Web build
        run: pnpm check
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Protocol, SQLite, identity, repositories, restart and verified backup/restore tests
        run: cargo test --workspace --locked
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose -f deploy/docker/compose.yaml config --quiet
      - run: docker compose -f deploy/docker/compose.yaml build
      - run: docker compose -f deploy/docker/compose.yaml up --detach
      - name: Verify same-origin health and Web
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/v1/health
          curl --fail http://127.0.0.1:3000/ | grep 'id="app"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/v1/missing)" = 404
      - if: always()
        run: docker compose -f deploy/docker/compose.yaml down
